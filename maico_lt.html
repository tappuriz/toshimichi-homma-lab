<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Management & AI Commons Osaka - ゆるLT会</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #05070f;
      --cyan-main: #00f2fe;
      --cyan-sub: #4facfe;
      --pink-main: #ff0844;
      --pink-sub: #ffb199;
      --gold: #ffe600;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: text;
    }

    body {
      font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background-color: var(--bg-dark);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 1.5rem 1rem 6rem;
    }

    .font-en {
      font-family: 'Montserrat', sans-serif;
    }

    /* Animated Perspective Cyber Grid */
    .cyber-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(0, 242, 254, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 8, 68, 0.07) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridMove 15s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 60px 60px; }
    }

    /* Ambient Glow Orbs */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      z-index: 0;
      pointer-events: none;
      animation: orbFloat 10s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 550px;
      height: 550px;
      background: rgba(0, 242, 254, 0.22);
      top: -120px;
      left: -100px;
    }
    .orb-2 {
      width: 550px;
      height: 550px;
      background: rgba(255, 8, 68, 0.22);
      bottom: -120px;
      right: -100px;
      animation-delay: -5s;
    }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }

    /* Particle Canvas */
    #particle-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Keyframe Animations for Infographics */
    @keyframes spinSlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.4); opacity: 1; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    @keyframes pinBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes laserScan {
      0% { top: 4%; opacity: 0.9; }
      50% { top: 92%; opacity: 1; }
      100% { top: 4%; opacity: 0.9; }
    }
    @keyframes cardFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes cardFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes arrowSlide {
      0%, 100% { transform: translateX(0); opacity: 0.6; }
      50% { transform: translateX(12px); opacity: 1; }
    }
    @keyframes borderFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes gaugePulse {
      0%, 100% { stroke-dashoffset: 65; filter: drop-shadow(0 0 6px currentColor); }
      50% { stroke-dashoffset: 45; filter: drop-shadow(0 0 14px currentColor); }
    }
    @keyframes eventTitlePulse {
      0%, 100% { transform: translateX(0) scale(1); }
      50% { transform: translateX(10px) scale(1.035); }
    }
    @keyframes titleHalo {
      0%, 100% { transform: scale(0.86); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    @keyframes borderOrbit {
      to { stroke-dashoffset: -100; }
    }
    @keyframes slideEnter {
      from { opacity: 0; transform: translateX(38px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideEnterBack {
      from { opacity: 0; transform: translateX(-38px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes venueSweep {
      0%, 32% { transform: translateX(-140%) skewX(-22deg); opacity: 0; }
      42% { opacity: 0.75; }
      58% { opacity: 0.75; }
      68%, 100% { transform: translateX(420%) skewX(-22deg); opacity: 0; }
    }

    .hud-spin {
      transform-origin: center;
      animation: spinSlow 14s linear infinite;
    }
    .hud-spin-rev {
      transform-origin: center;
      animation: spinReverse 9s linear infinite;
    }
    .clock-hand-min {
      transform-origin: 50px 50px;
      animation: spinSlow 6s linear infinite;
    }
    .clock-hand-hour {
      transform-origin: 50px 50px;
      animation: spinSlow 36s linear infinite;
    }
    .radar-wave-1 {
      transform-origin: 50px 76px;
      animation: pulseRing 2.4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }
    .radar-wave-2 {
      transform-origin: 50px 76px;
      animation: pulseRing 2.4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 1.2s;
    }
    .pin-anim {
      animation: pinBounce 2s ease-in-out infinite;
    }
    .duration-arc {
      stroke-dasharray: 220;
      stroke-dashoffset: 60;
      animation: gaugePulse 3s ease-in-out infinite;
    }
    .event-title {
      position: relative;
      transform-origin: left center;
    }
    .event-title::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: -28%;
      left: -4%;
      width: 75%;
      height: 150%;
      border-radius: 999px;
      background: radial-gradient(ellipse, rgba(0, 242, 254, 0.3), transparent 70%);
      filter: blur(12px);
      animation: titleHalo 2.4s ease-in-out infinite;
    }
    .card-12 .event-title::before {
      background: radial-gradient(ellipse, rgba(255, 8, 68, 0.32), transparent 70%);
    }
    .date-info {
      position: relative;
      overflow: hidden;
    }
    .date-border {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .date-border rect {
      stroke: currentColor;
      stroke-dasharray: 14 86;
      stroke-dashoffset: 0;
      filter: drop-shadow(0 0 6px currentColor);
      animation: borderOrbit 3.6s linear infinite;
    }
    .venue-info {
      position: relative;
      overflow: hidden;
    }
    .venue-info::after {
      content: "";
      position: absolute;
      z-index: 0;
      top: -20%;
      left: 0;
      width: 25%;
      height: 140%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.24), transparent);
      animation: venueSweep 5.5s ease-in-out infinite;
      pointer-events: none;
    }
    .venue-info > * {
      position: relative;
      z-index: 1;
    }

    /* Card Styling */
    .card-11 {
      background: linear-gradient(155deg, rgba(12, 22, 44, 0.88) 0%, rgba(7, 12, 26, 0.94) 100%);
      border: 3px solid rgba(0, 242, 254, 0.55);
      box-shadow: 0 0 45px rgba(0, 242, 254, 0.2), inset 0 0 35px rgba(0, 242, 254, 0.08);
      animation: cardFloat1 6s ease-in-out infinite;
    }
    .card-11:hover {
      border-color: #00f2fe;
      box-shadow: 0 0 65px rgba(0, 242, 254, 0.4), inset 0 0 45px rgba(0, 242, 254, 0.15);
    }

    .card-12 {
      background: linear-gradient(155deg, rgba(40, 12, 28, 0.88) 0%, rgba(22, 7, 16, 0.94) 100%);
      border: 3px solid rgba(255, 8, 68, 0.55);
      box-shadow: 0 0 45px rgba(255, 8, 68, 0.2), inset 0 0 35px rgba(255, 8, 68, 0.08);
      animation: cardFloat2 6s ease-in-out infinite 3s;
    }
    .card-12:hover {
      border-color: #ff0844;
      box-shadow: 0 0 65px rgba(255, 8, 68, 0.4), inset 0 0 45px rgba(255, 8, 68, 0.15);
    }

    /* Laser Line over QR */
    .laser-line-cyan {
      position: absolute;
      left: 0;
      width: 100%;
      height: 4px;
      background: #00f2fe;
      box-shadow: 0 0 15px 4px #00f2fe;
      animation: laserScan 2.6s ease-in-out infinite;
      pointer-events: none;
    }
    .laser-line-pink {
      position: absolute;
      left: 0;
      width: 100%;
      height: 4px;
      background: #ff0844;
      box-shadow: 0 0 15px 4px #ff0844;
      animation: laserScan 2.6s ease-in-out infinite 1.3s;
      pointer-events: none;
    }
    @keyframes qrIndicator {
      0%, 100% { transform: scaleX(0.25); opacity: 0.45; }
      50% { transform: scaleX(1); opacity: 1; }
    }
    .qr-code {
      overflow: visible;
    }
    .qr-code .laser-line-cyan,
    .qr-code .laser-line-pink {
      top: calc(100% + 12px);
      animation: qrIndicator 2.6s ease-in-out infinite;
      transform-origin: left center;
    }

    /* Corner Brackets for HUD look */
    .hud-corner {
      position: absolute;
      width: 26px;
      height: 26px;
      pointer-events: none;
    }
    .tl { top: 14px; left: 14px; border-top: 4px solid currentColor; border-left: 4px solid currentColor; border-top-left-radius: 8px; }
    .tr { top: 14px; right: 14px; border-top: 4px solid currentColor; border-right: 4px solid currentColor; border-top-right-radius: 8px; }
    .bl { bottom: 14px; left: 14px; border-bottom: 4px solid currentColor; border-left: 4px solid currentColor; border-bottom-left-radius: 8px; }
    .br { bottom: 14px; right: 14px; border-bottom: 4px solid currentColor; border-right: 4px solid currentColor; border-bottom-right-radius: 8px; }

    /* Glowing Text Shadows */
    .glow-cyan {
      text-shadow: 0 0 25px rgba(0, 242, 254, 0.75), 0 0 8px rgba(0, 242, 254, 0.5);
    }
    .glow-pink {
      text-shadow: 0 0 25px rgba(255, 8, 68, 0.8), 0 0 8px rgba(255, 8, 68, 0.5);
    }
    .glow-gold {
      text-shadow: 0 0 20px rgba(255, 230, 0, 0.65);
    }

    .community-name-sweep {
      position: relative;
      display: inline-block;
      isolation: isolate;
    }
    .community-name-sweep::after {
      content: "";
      position: absolute;
      inset: -10% 0;
      background: linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, 0.4) 50%, transparent 65%);
      transform: translateX(-120%);
      pointer-events: none;
      animation: communityNameSweep 1.4s ease-out 0.5s 1 both;
    }
    @keyframes communityNameSweep {
      to { transform: translateX(120%); }
    }
    .weekday-badge {
      animation: weekdayGlow 900ms ease-out 700ms 1 both;
    }
    @keyframes weekdayGlow {
      0%, 100% { filter: brightness(1); }
      40% { filter: brightness(1.2) drop-shadow(0 0 12px currentColor); }
    }

    .connpass-button {
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }
    .connpass-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }
    .connpass-button:active {
      transform: translateY(1px) scale(0.97);
    }
    @media (prefers-reduced-motion: reduce) {
      .connpass-button {
        transition: none;
      }
      .community-name-sweep::after,
      .weekday-badge {
        animation: none;
      }
    }

    body.presentation-mode {
      padding: 0;
      overflow: hidden;
      align-items: stretch;
      justify-content: stretch;
      min-height: 100svh;
      height: 100svh;
    }
    body.presentation-mode > .relative {
      width: 100vw;
      max-width: none;
      height: 100svh;
    }
    body.presentation-mode #event-cards {
      height: 100%;
    }
    body.presentation-mode #event-header {
      display: none;
    }
    body.presentation-mode #event-cards {
      display: block;
    }
    body.presentation-mode .event-card {
      display: none;
      min-height: 100svh;
      height: 100svh;
      border-radius: 0;
    }
    body.presentation-mode .event-card.is-active {
      display: flex;
      animation: slideEnter 0.42s ease-out both;
    }
    body.presentation-mode .event-card.is-active.slide-backward {
      animation-name: slideEnterBack;
    }
    body.presentation-mode .card-11,
    body.presentation-mode .card-12 {
      animation: none;
    }
    body.presentation-mode .qr-code {
      width: var(--qr-size, min(24rem, 34svh));
      height: var(--qr-size, min(24rem, 34svh));
    }
    body.presentation-mode .event-card {
      padding: 1.25rem !important;
      gap: 1rem !important;
      justify-content: space-evenly !important;
    }
    body.presentation-mode .event-card > .flex.flex-col.gap-6 {
      gap: 0.75rem !important;
    }
    body.presentation-mode .date-info,
    body.presentation-mode .venue-info {
      gap: 0.75rem !important;
      padding: 0.75rem !important;
    }
    body.presentation-mode .date-info > div:first-child,
    body.presentation-mode .venue-info > div:first-child {
      width: 5rem !important;
      height: 5rem !important;
    }
    body.presentation-mode .community-name {
      font-size: 3rem !important;
    }
    body.presentation-mode .event-title > span:first-child {
      font-size: 2.5rem !important;
    }
    body.presentation-mode .event-number {
      font-size: 4.5rem !important;
    }
    body.presentation-mode .event-badge {
      width: 9rem !important;
      height: 9rem !important;
    }

    @media (max-height: 800px) {
      body.presentation-mode .event-card {
        padding: 1rem;
        gap: 0.75rem;
      }
      body.presentation-mode .event-card > .flex.flex-col.gap-6 {
        gap: 0.75rem;
      }
      body.presentation-mode .date-info,
      body.presentation-mode .venue-info {
        gap: 0.75rem;
        padding: 0.875rem;
      }
      body.presentation-mode .date-info > div:first-child,
      body.presentation-mode .venue-info > div:first-child {
        width: 5rem;
        height: 5rem;
      }
      body.presentation-mode .qr-code {
        width: var(--qr-size, 11rem);
        height: var(--qr-size, 11rem);
      }
      body.presentation-mode #presentation-controls {
        right: 1rem;
        bottom: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Background Decorations -->
  <div class="cyber-grid"></div>
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>
  <canvas id="particle-canvas"></canvas>

  <!-- Fullscreen Toggle Button (Corner Decoration) -->
  <button id="fullscreen-btn" type="button" title="全画面表示に切り替え" aria-label="全画面表示に切り替え" class="fixed top-4 right-4 z-50 bg-slate-900/80 hover:bg-slate-800 text-white/80 hover:text-white border-2 border-white/20 rounded-2xl p-3 backdrop-blur-md transition-all shadow-lg">
    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
  </button>

  <!-- Main Infographic Wrapper -->
  <div class="relative z-10 w-full max-w-[1440px] flex flex-col gap-6 lg:gap-8">

    <!-- ==================== EVENT INFOGRAPHIC CARD ==================== -->
    <main id="event-cards" class="grid grid-cols-1 gap-8 lg:gap-10 items-stretch">

      <!-- ==================== SPECIAL LECTURE (CYBER CYAN) ==================== -->
      <section class="event-card card-11 relative rounded-[40px] p-6 sm:p-9 flex flex-col justify-between gap-7 backdrop-blur-xl overflow-hidden text-cyan-400">
        <!-- HUD Corner Decos -->
        <div class="hud-corner tl"></div>
        <div class="hud-corner tr"></div>
        <div class="hud-corner bl"></div>
        <div class="hud-corner br"></div>

        <!-- Top Badge Bar: Title & Animated HUD Ring -->
        <div class="flex items-center justify-between border-b-2 border-cyan-400/25 pb-5 gap-4">
          <div class="flex flex-col gap-1">
            <span class="community-name community-name-sweep text-2xl sm:text-3xl lg:text-4xl font-black tracking-wide text-white">データ分析・AI x データサイエンスコミュニティ</span>
            <div class="event-title flex items-baseline gap-4 flex-wrap">
              <span class="text-white text-3xl sm:text-4xl lg:text-5xl font-black tracking-wider">生成AIはTop 2%科学者を超えたのか？</span>
            </div>
            <span class="text-lg sm:text-xl font-black text-cyan-300">富山大学・庄司翼教授 特別講演</span>
          </div>

          <!-- Animated Rotating HUD Infographic Badge -->
          <div class="event-badge relative w-24 h-24 sm:w-28 sm:h-28 flex-shrink-0 flex items-center justify-center">
            <svg class="w-full h-full" viewBox="0 0 120 120">
              <!-- Outer Dashed Ring -->
              <circle class="hud-spin" cx="60" cy="60" r="54" fill="none" stroke="#00f2fe" stroke-width="3" stroke-dasharray="18 10 6 10"/>
              <!-- Inner Reverse Ring -->
              <circle class="hud-spin-rev" cx="60" cy="60" r="42" fill="none" stroke="#4facfe" stroke-width="2.5" stroke-dasharray="28 14"/>
              <!-- Center Glowing Hexagon -->
              <polygon points="60,28 87,44 87,76 60,92 33,76 33,44" fill="rgba(0,242,254,0.18)" stroke="#00f2fe" stroke-width="2.5"/>
              <!-- Lightning Icon Inside -->
              <path d="M64 36L45 62H59L55 84L75 58H61L64 36Z" fill="#ffe600"/>
            </svg>
          </div>
        </div>

        <!-- Middle Infographic Blocks -->
        <div class="flex flex-col gap-6">

          <!-- DATE & TIME INFOGRAPHIC -->
          <div class="date-info flex flex-col sm:flex-row items-start sm:items-center gap-5 bg-cyan-950/40 border-2 border-cyan-400/35 rounded-3xl p-5 shadow-inner">
            <svg class="date-border" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <rect x="1.5" y="1.5" width="97" height="97" rx="7" fill="none" stroke-width="2" vector-effect="non-scaling-stroke" pathLength="100"/>
            </svg>
            <!-- Animated Clock & 90min Gauge SVG -->
            <div class="w-24 h-24 sm:w-28 sm:h-28 flex-shrink-0 relative flex items-center justify-center bg-slate-950/80 rounded-2xl border border-cyan-400/40 p-2">
              <svg class="w-full h-full text-cyan-400" viewBox="0 0 100 100">
                <!-- Background Track -->
                <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(0,242,254,0.15)" stroke-width="8"/>
                <!-- Animated 90min Gauge Arc -->
                <circle class="duration-arc" cx="50" cy="50" r="40" fill="none" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" transform="rotate(-90 50 50)"/>
                <!-- Clock Ticks -->
                <circle cx="50" cy="50" r="28" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="2 12.6"/>
                <!-- Animated Hands -->
                <line class="clock-hand-hour" x1="50" y1="50" x2="50" y2="30" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
                <line class="clock-hand-min" x1="50" y1="50" x2="70" y2="50" stroke="#ffe600" stroke-width="3.5" stroke-linecap="round"/>
                <circle cx="50" cy="50" r="5" fill="#00f2fe"/>
              </svg>
            </div>

            <!-- Huge Date & Time Text -->
            <div class="flex flex-col gap-2 w-full">
              <div class="flex items-center flex-wrap gap-3">
                <span class="text-white text-3xl sm:text-5xl font-black tracking-tight leading-none">
                  2026年11月16日
                </span>
                <span class="weekday-badge px-4 py-1 rounded-xl bg-cyan-400 text-slate-950 text-2xl sm:text-4xl font-black shadow-[0_0_20px_rgba(0,242,254,0.8)]">
                  月
                </span>
              </div>
              <div class="font-en text-4xl sm:text-5xl font-black text-yellow-300 glow-gold tracking-wide leading-none mt-1">
                18:30 〜 21:00
              </div>
            </div>
          </div>

          <!-- EVENT VENUE -->
          <div class="venue-info flex flex-col sm:flex-row items-start sm:items-center gap-5 bg-cyan-950/40 border-2 border-cyan-400/35 rounded-3xl p-5 shadow-inner">
            <!-- Location Icon -->
            <div class="w-24 h-24 sm:w-28 sm:h-28 flex-shrink-0 relative flex items-center justify-center bg-slate-950/80 rounded-2xl border border-cyan-400/40 p-2">
              <svg class="w-full h-full" viewBox="0 0 100 100" fill="none" aria-hidden="true">
                <ellipse class="radar-wave-1" cx="50" cy="76" rx="22" ry="9" fill="none" stroke="#00f2fe" stroke-width="3"/>
                <ellipse class="radar-wave-2" cx="50" cy="76" rx="22" ry="9" fill="none" stroke="#00f2fe" stroke-width="3"/>
                <ellipse cx="50" cy="76" rx="10" ry="4" fill="#00f2fe" opacity="0.5"/>
                <g class="pin-anim">
                  <path d="M50 14C35.6 14 24 25.6 24 40C24 58.5 50 76 50 76C50 76 76 58.5 76 40C76 25.6 64.4 14 50 14Z" fill="#00f2fe" stroke="#ffffff" stroke-width="3"/>
                  <circle cx="50" cy="39" r="10" fill="#05070f"/>
                </g>
              </svg>
            </div>

            <!-- Venue Heading and Map Link -->
            <div class="flex flex-col gap-2 text-white">
              <div class="text-3xl sm:text-4xl font-black leading-tight">
                開催場所

    <nav id="presentation-controls" class="fixed bottom-4 left-1/2 z-50 flex max-w-[calc(100vw-1rem)] -translate-x-1/2 items-center gap-1 rounded-2xl border-2 border-white/20 bg-slate-900/90 px-2 py-2 shadow-lg backdrop-blur-md sm:gap-4 sm:px-4 sm:py-3" aria-label="イベント切替">
      <button id="previous-slide" type="button" class="shrink-0 whitespace-nowrap rounded-xl px-3 py-2 font-black text-white transition hover:bg-white/15 sm:px-4" aria-label="前のイベント">← 前へ</button>
      <span id="slide-indicator" class="shrink-0 whitespace-nowrap font-en text-lg font-black text-cyan-300" aria-live="polite">1 / 2</span>
      <button id="next-slide" type="button" class="shrink-0 whitespace-nowrap rounded-xl px-3 py-2 font-black text-white transition hover:bg-white/15 sm:px-4" aria-label="次のイベント">次へ →</button>
    </nav>
  </div>

  <script>
    const eventCards = document.getElementById('event-cards');
    eventCards.insertBefore(eventCards.querySelector('.card-12'), eventCards.querySelector('.card-11'));
    const slides = Array.from(document.querySelectorAll('.event-card:not([hidden])'));
    const previousSlideButton = document.getElementById('previous-slide');
    const nextSlideButton = document.getElementById('next-slide');
    const slideIndicator = document.getElementById('slide-indicator');
    const fullscreenButton = document.getElementById('fullscreen-btn');
    let activeSlideIndex = 0;
    let slideDirection = 1;

    function animateEventNumber(slide) {
      const number = slide.querySelector('.event-number');
      if (!number) {
        return;
      }

      const target = Number(number.dataset.eventNumber);
      const duration = 650;
      const startTime = performance.now();

      function step(currentTime) {
        const progress = Math.min((currentTime - startTime) / duration, 1);
        number.textContent = `#${Math.round(target * progress)}`;
        if (progress < 1) {
          requestAnimationFrame(step);
        }
      }

      number.textContent = '#0';
      requestAnimationFrame(step);
    }

    function fitActiveSlideToViewport() {
      if (!document.body.classList.contains('presentation-mode')) {
        return;
      }

      const slide = slides[activeSlideIndex];
      const qrCode = slide.querySelector('.qr-code');
      qrCode.style.removeProperty('--qr-size');

      requestAnimationFrame(() => {
        const overflow = slide.scrollHeight - slide.clientHeight;
        if (overflow > 0) {
          const fittedSize = Math.max(96, qrCode.getBoundingClientRect().height - overflow - 16);
          qrCode.style.setProperty('--qr-size', `${fittedSize}px`);
        }
      });
    }

    function updateNavigationControls() {
      slideIndicator.textContent = `${activeSlideIndex + 1} / ${slides.length}`;
      previousSlideButton.disabled = activeSlideIndex === 0;
      nextSlideButton.disabled = activeSlideIndex === slides.length - 1;
      previousSlideButton.classList.toggle('opacity-40', previousSlideButton.disabled);
      nextSlideButton.classList.toggle('opacity-40', nextSlideButton.disabled);
    }

    function updateSlide() {
      slides.forEach((slide, index) => {
        slide.classList.toggle('is-active', index === activeSlideIndex);
        slide.classList.toggle('slide-backward', index === activeSlideIndex && slideDirection < 0);
      });
      animateEventNumber(slides[activeSlideIndex]);
      updateNavigationControls();
      fitActiveSlideToViewport();
    }

    function getVisibleSlideIndex() {
      const anchor = window.innerHeight * 0.4;
      return slides.reduce((closestIndex, slide, index) => {
        const bounds = slide.getBoundingClientRect();
        const distance = anchor < bounds.top
          ? bounds.top - anchor
          : anchor > bounds.bottom
            ? anchor - bounds.bottom
            : 0;
        const closestBounds = slides[closestIndex].getBoundingClientRect();
        const closestDistance = anchor < closestBounds.top
          ? closestBounds.top - anchor
          : anchor > closestBounds.bottom
            ? anchor - closestBounds.bottom
            : 0;
        return distance < closestDistance ? index : closestIndex;
      }, 0);
    }

    async function changeSlide(direction) {
      if (!document.fullscreenElement) {
        activeSlideIndex = getVisibleSlideIndex();
      }
      const nextIndex = activeSlideIndex + direction;
      if (nextIndex >= 0 && nextIndex < slides.length) {
        slideDirection = direction;
        activeSlideIndex = nextIndex;
        updateSlide();
        if (!document.fullscreenElement) {
          slides[activeSlideIndex].scrollIntoView({
            behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
            block: 'start'
          });
        }
      }
    }

    async function toggleFullScreen() {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else if (document.fullscreenEnabled) {
          await document.documentElement.requestFullscreen();
        } else {
          throw new Error('Fullscreen is not supported by this browser.');
        }
      } catch (error) {
        console.error('Failed to toggle presentation fullscreen mode.', error);
        fullscreenButton.title = 'このブラウザーでは全画面表示を利用できません';
        fullscreenButton.setAttribute('aria-label', fullscreenButton.title);
      }
    }

    function replaceQR(event, slotId) {
      const [file] = event.target.files;
      if (!file) {
        return;
      }

      const image = document.createElement('img');
      image.src = URL.createObjectURL(file);
      image.alt = 'イベント申込用QRコード';
      image.className = 'h-full w-full object-contain';
      image.onload = () => URL.revokeObjectURL(image.src);
      document.getElementById(slotId).replaceChildren(image);
    }

    document.addEventListener('fullscreenchange', () => {
      const isPresentationMode = Boolean(document.fullscreenElement);
      document.body.classList.toggle('presentation-mode', isPresentationMode);
      fullscreenButton.title = isPresentationMode ? '全画面表示を終了' : '全画面表示に切り替え';
      fullscreenButton.setAttribute('aria-label', fullscreenButton.title);
      updateSlide();
    });

    fullscreenButton.addEventListener('click', toggleFullScreen);
    previousSlideButton.addEventListener('click', () => changeSlide(-1));
    nextSlideButton.addEventListener('click', () => changeSlide(1));
    window.addEventListener('resize', fitActiveSlideToViewport);
    window.addEventListener('scroll', () => {
      if (!document.fullscreenElement) {
        activeSlideIndex = getVisibleSlideIndex();
        updateNavigationControls();
      }
    }, { passive: true });
    document.addEventListener('keydown', (event) => {
      if (event.target.closest('input, textarea, select, [contenteditable="true"]')) {
        return;
      }
      if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
        if (!document.fullscreenElement) {
          if (event.key !== 'ArrowLeft') {
            return;
          }
          activeSlideIndex = getVisibleSlideIndex();
        }
        event.preventDefault();
        changeSlide(-1);
      } else if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') {
        if (!document.fullscreenElement) {
          if (event.key !== 'ArrowRight') {
            return;
          }
          activeSlideIndex = getVisibleSlideIndex();
        }
        event.preventDefault();
        changeSlide(1);
      }
    });

    updateSlide();
  </script>
